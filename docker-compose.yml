# =============================================================================
# wacrm — stack completo self-hosted para Coolify / docker compose
#
#   app (Next.js 16) ──► kong ──► { auth, rest, realtime, storage }
#                         │
#                         └──► db (Postgres 17 + RLS)
#
# Todo corre en el servidor local; no hay dependencias de servicios externos.
# Los secretos se leen de variables de entorno (.env): nada sensible vive en
# este archivo.
# =============================================================================
name: wacrm

services:
  # ---------------------------------------------------------------------------
  # Postgres (imagen supabase: roles, extensiones y publicación realtime ya
  # vienen preparadas). Los scripts de docker/volumes/db solo corren la
  # primera vez, al inicializar el volumen.
  # ---------------------------------------------------------------------------
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.167
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: /var/run/postgresql
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      PGPORT: "5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
      - ./docker/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./docker/volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./docker/volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1", "-p", "5432"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:8502:5432"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]

  # ---------------------------------------------------------------------------
  # GoTrue (auth de Supabase)
  # ---------------------------------------------------------------------------
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_DB_MIGRATIONS_PATH: /usr/local/etc/auth/migrations
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_VALID_METHODS: HS256
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      GOTRUE_PASSWORD_HIBP_ENABLED: "false"
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "true"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "30"
      GOTRUE_SMTP_MAX_FREQUENCY: 10s
      GOTRUE_MAILER_OTP_EXP: "600"
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mailpit}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-no-reply@varillas.work}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-wacrm}
      GOTRUE_MAILER_NOTIFICATIONS_PASSWORD_CHANGED_ENABLED: "true"
      GOTRUE_SESSIONS_TIMEBOX: 720h
      GOTRUE_SESSIONS_INACTIVITY_TIMEOUT: 168h
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # PostgREST (API REST sobre Postgres, con RLS)
  # ---------------------------------------------------------------------------
  rest:
    image: public.ecr.aws/supabase/postgrest:v16.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
      PGRST_ADMIN_SERVER_PORT: "3001"
    command: ["postgrest"]

  # ---------------------------------------------------------------------------
  # Realtime (canales websocket: inbox, notificaciones, presencia)
  # ---------------------------------------------------------------------------
  realtime:
    image: public.ecr.aws/supabase/realtime:v2.134.10
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"

  # ---------------------------------------------------------------------------
  # Storage API (avatares, media de flujo y de chat — buckets creados por las
  # migraciones; backend de archivos en disco, sin S3 externo)
  # ---------------------------------------------------------------------------
  storage:
    image: public.ecr.aws/supabase/storage-api:v1.74.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      STORAGE_PUBLIC_URL: ${API_EXTERNAL_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:-stub}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${STORAGE_TENANT_ID:-stub}
      REGION: ${REGION:-local}
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/status').then((r)=>{if(!r.ok)throw new Error(r.status)})\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------
  # postgres-meta + Studio (administración de la BD y de Supabase)
  # ---------------------------------------------------------------------------
  meta:
    image: public.ecr.aws/supabase/postgres-meta:v0.99.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
    healthcheck:
      test: ["CMD-SHELL", "node --eval=\"fetch('http://127.0.0.1:8080/health').then((r) => {if (!r.ok) throw new Error(r.status)})\""]
      interval: 5s
      timeout: 5s
      retries: 10

  studio:
    image: public.ecr.aws/supabase/studio:2026.08.24-sha-8ec45b2
    restart: unless-stopped
    depends_on:
      meta:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      DEFAULT_ORGANIZATION_NAME: wacrm
      DEFAULT_PROJECT_NAME: wacrm
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${API_EXTERNAL_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
    volumes:
      - studio-snippets:/app/snippets
      - studio-funciones:/app/edge-functions
    healthcheck:
      test: ["CMD-SHELL", "node --eval=\"fetch('http://127.0.0.1:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Kong: puerta de entrada única de la API de Supabase
  #   expuesta en 127.0.0.1:8501 (el túnel la publica como
  #   supabase-wacrm.varillas.work; Studio queda detrás de basic auth)
  # ---------------------------------------------------------------------------
  kong:
    image: public.ecr.aws/supabase/kong:2.8.1
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
      realtime:
        condition: service_started
      storage:
        condition: service_started
      studio:
        condition: service_started
    ports:
      - "127.0.0.1:8501:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_NGINX_WORKER_PROCESSES: "1"
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes:
      - ./docker/kong/kong.yml:/home/kong/temp.yml:ro
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && exec /docker-entrypoint.sh kong docker-start'
    healthcheck:
      test: ["CMD-SHELL", "kong health"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # Migrador: aplica supabase/migrations (idempotente, registra lo aplicado en
  # el esquema "migraciones"). Espera a auth (esquema auth.users) y a storage
  # (tabla storage.buckets) antes de correr.
  # ---------------------------------------------------------------------------
  migrador:
    image: public.ecr.aws/supabase/postgres:17.6.1.167
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-postgres}
    volumes:
      - ./supabase/migrations:/migraciones:ro
      - ./docker/migrador:/scripts:ro
    entrypoint: ["sh", "/scripts/esperar-y-migrar.sh"]

  # ---------------------------------------------------------------------------
  # Mailpit: SMTP local (captura los correos de auth; visor en
  # 127.0.0.1:8503 dentro del servidor)
  # ---------------------------------------------------------------------------
  mailpit:
    image: public.ecr.aws/supabase/mailpit:v1.30.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8503:8025"

  # ---------------------------------------------------------------------------
  # App Next.js (build desde Dockerfile; publicada en 8500 para LAN y túnel)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${API_EXTERNAL_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-es}
        NEXT_PUBLIC_META_APP_ID: ${NEXT_PUBLIC_META_APP_ID:-}
        NEXT_PUBLIC_META_EMBEDDED_SIGNUP_CONFIG_ID: ${NEXT_PUBLIC_META_EMBEDDED_SIGNUP_CONFIG_ID:-}
    restart: unless-stopped
    depends_on:
      migrador:
        condition: service_completed_successfully
      kong:
        condition: service_healthy
    ports:
      - "8500:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_SUPABASE_URL: ${API_EXTERNAL_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_APP_ID: ${META_APP_ID:-}
      NEXT_PUBLIC_META_APP_ID: ${NEXT_PUBLIC_META_APP_ID:-}
      NEXT_PUBLIC_META_EMBEDDED_SIGNUP_CONFIG_ID: ${NEXT_PUBLIC_META_EMBEDDED_SIGNUP_CONFIG_ID:-}
      CRON_SECRET: ${CRON_SECRET}
      AUTOMATION_CRON_SECRET: ${AUTOMATION_CRON_SECRET:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-es}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then((r)=>{if(!r.ok)throw new Error(r.status)})\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  db-data:
  db-config:
  storage-data:
  studio-snippets:
  studio-funciones:
